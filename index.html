<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador OKR - Interactivo</title>
  <style>
    /* Estilos Generales y Tema Azul Dark Mode */
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      --card-bg: rgba(30, 58, 138, 0.35);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-blue: #38bdf8;
      --accent-hover: #60a5fa;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 30px;
      box-sizing: border-box;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 30px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Targetas principales */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .card:hover, .card.selected {
      border-color: var(--accent-blue);
      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.25);
      transform: translateY(-2px);
    }

    .card-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* Animación de Escala en Números */
    .metric-value {
      font-size: 2.8rem;
      font-weight: 700;
      color: var(--text-main);
      display: inline-block;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.2s ease;
    }

    /* Efecto al presionar o seleccionar */
    .card:hover .metric-value,
    .card:active .metric-value,
    .card.selected .metric-value {
      transform: scale(1.18);
      color: var(--accent-blue);
    }

    /* Filtros y Opciones */
    .filter-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .chip:hover, .chip.active {
      background: var(--accent-blue);
      color: #0f172a;
      font-weight: 600;
      border-color: var(--accent-blue);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>OKR-009 - Simulador Interactivo</h1>
      <div class="subtitle">Selecciona cualquier indicador para resaltar métricas y expandir datos.</div>
    </header>

    <div class="dashboard-grid">
      <div class="card selected" onclick="selectCard(this)">
        <div class="card-title">NPS Total</div>
        <div class="metric-value">85%</div>
      </div>

      <div class="card" onclick="selectCard(this)">
        <div class="card-title">Retención</div>
        <div class="metric-value">86%</div>
      </div>

      <div class="card" onclick="selectCard(this)">
        <div class="card-title">Reporte Mensual</div>
        <div class="metric-value">89%</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Filtrar por Cuenta</div>
      <div class="filter-group">
        <button class="chip active">Todas</button>
        <button class="chip">ADM</button>
        <button class="chip">Bepensa</button>
        <button class="chip">Gifan</button>
        <button class="chip">Spinmaster</button>
        <button class="chip">Multimarca</button>
      </div>
    </div>
  </div>

  <script>
    function selectCard(element) {
      document.querySelectorAll('.dashboard-grid .card').forEach(card => {
        card.classList.remove('selected');
      });
      element.classList.add('selected');
    }
  </script>

</body>
</html>
